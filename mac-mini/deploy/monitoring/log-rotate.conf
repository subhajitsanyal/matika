# CareLog Log Rotation Configuration
# Installed to: /usr/local/etc/logrotate.d/carelog
#
# Rotates all service logs in /opt/carelog/logs/
# Retention: 30 days

/opt/carelog/logs/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    dateext
    dateformat -%Y%m%d
    su carelog staff
    create 0644 carelog staff
}
