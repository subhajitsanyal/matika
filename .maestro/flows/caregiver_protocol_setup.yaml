# Phase C end-to-end: caregiver signs in, adds a fresh patient, runs
# the v2 caregiver_onboarding conversation via the text-input fallback,
# verifies the Sonnet protocol-extraction summary appears.
#
# Why text-input fallback instead of voice: deterministic, no STT
# dependency, no language-pack setup. The voice path is exercised by
# manual testing per docs/android_v2_smoke_test_runbook.md.
#
# Pre-conditions:
#   - APK already installed on the connected device.
#   - Caregiver creds in the shell env. See .maestro/README.md.
#   - Backend dev /health green.
#
# Run:
#   source ~/.matika-test-creds.env
#   scripts/maestro-run.sh caregiver_protocol_setup

appId: com.carelog
---
# Fresh launch every run to avoid cross-test state.
- launchApp:
    clearState: true

# Generate a Cognito-unique patient email. Cognito enforces email
# uniqueness, so each run needs a fresh +alias suffix.
- runScript: ../scripts/generate_patient_email.js

# ── Sign in as the caregiver ────────────────────────────────
# `extendedWaitUntil` is Maestro's wait-with-timeout primitive.
# `assertVisible` and `tapOn` are point-in-time and don't take a
# timeout — use extendedWaitUntil before them when the screen needs
# time to render (e.g. after a launch or network call).
- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_CAREGIVER_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_CAREGIVER_PASSWORD}
# Dismiss the soft keyboard so the Sign In button at the bottom of
# the screen is no longer covered.
- hideKeyboard
- tapOn:
    id: login_button

# ── Caregiver home → Add Patient FAB ────────────────────────
# Dashboard fetches getPatients() then getAlerts() per patient — cold
# Lambdas can push this over 30s on first load.
# The FAB is an ExtendedFloatingActionButton — its inner Text isn't
# exposed as a top-level a11y text node, so we address it by testTag.
- extendedWaitUntil:
    visible:
      id: onboard_patient_fab
    timeout: 60000
- tapOn:
    id: onboard_patient_fab

# ── Chooser dialog (consolidated 2026-05-24) → Form path ────
# The single Add Patient FAB opens an AlertDialog with Voice/Form
# options. CG-V2-02 is the form smoke gate, so select Form + confirm.
- extendedWaitUntil:
    visible: { id: add_patient_dialog }
    timeout: 5000
- tapOn: { id: add_patient_choice_form }
- tapOn: { id: add_patient_confirm }

# ── Fill the patient profile form ───────────────────────────
- extendedWaitUntil:
    visible:
      id: onboarding_name
    timeout: 10000
- tapOn:
    id: onboarding_name
- inputText: ${output.patientName}
- tapOn:
    id: onboarding_email
- inputText: ${output.patientEmail}
# DOB / Gender / Conditions left blank — pilot smoke just needs the
# create call to succeed and the v2 routing to fire. Add fields here
# when you want to exercise more of the form.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: onboarding_create_button
    direction: DOWN
- tapOn:
    id: onboarding_create_button

# ── Credentials dialog → dismiss ────────────────────────────
- extendedWaitUntil:
    visible: "Patient Account Created"
    timeout: 30000
- tapOn: "Done"

# ── Verify the v2 protocol-config conversation opened ───────
# Hilt VM + nav transition + LaunchedEffect(startSession) can take a
# beat after the credentials dialog dismiss. matika_text_fallback
# only exists on MatikaConversationScreen, so its visibility uniquely
# identifies the v2 screen — no need to assert the title separately.
- extendedWaitUntil:
    visible:
      id: matika_text_fallback
    timeout: 30000

# ── Drive the conversation via the text fallback ────────────
# Single turn: describe the monitoring protocol. Sonnet typically
# follows up with clarifying questions ("what's her name", "what
# thresholds"), so a deterministic completion in N turns isn't
# reliable for automation — driving it past completion would need
# a chat loop, not a flat script.
#
# What this flow proves is the v2 wiring: caregiver creates a fresh
# patient, the new patient's cognito_sub flows through to the v2
# nav route, MatikaConversationScreen mounts in caregiver mode, the
# /conversation/turn endpoint runs against Bedrock, the LLM
# responds. That's the Phase C end-to-end check. The actual
# session-complete + protocol-extraction summary is exercised by
# manual testing per docs/android_v2_smoke_test_runbook.md.
- tapOn:
    id: matika_text_fallback
- inputText: "I want to track her blood pressure every morning, fasting blood sugar twice a week, and her weight on Sundays."
- tapOn:
    id: matika_text_send

# Wait for Sonnet to respond. The "thinking…" indicator disappears
# when isProcessingTurn flips back to false in the ViewModel —
# which only happens after a successful turn round-trip.
- extendedWaitUntil:
    notVisible: "thinking"
    timeout: 60000

# Sanity: confirm the response made it to UI state. The "you said"
# card always renders the last final user utterance, and the response
# card always renders the LLM reply — so seeing the text fallback
# field still empty + send button greyed (because text was cleared
# on send) is enough proof the turn completed cleanly.
- assertVisible:
    id: matika_text_fallback
