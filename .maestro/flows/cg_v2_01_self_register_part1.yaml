# CG-V2-01 part 1 — caregiver self-registration form fill.
#
# Drives the Register screen to completion using a known synthetic email
# generated by the wrapper (`scripts/cognito-harness-maestro.sh`). After
# tapping Create Account, Cognito sends a real OTP email; in automated
# tests we never read that email — the wrapper invokes
# `harness_admin_confirm_signup` instead (option C, launch-plan §4.3),
# which is equivalent to the user clicking the verification link.
#
# Part 2 (cg_v2_01_self_register_part2.yaml) drives login + consent +
# dashboard once the harness has confirmed the user.
#
# Env passed by the wrapper:
#   MATIKA_REGISTER_EMAIL     — the unique +alias email to register
#   MATIKA_REGISTER_PASSWORD  — the password to assign
#   MATIKA_REGISTER_NAME      — display name
#
# Run via wrapper, not directly: scripts/cognito-harness-maestro.sh cg-v2-01

appId: com.carelog
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: login_email }
    timeout: 15000

# Navigate to the Register screen.
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: { id: register_email }
    timeout: 10000

# Form is taller than the viewport. Scroll-into-view between every field
# per maestro_lessons.md #2 — `tapOn { id: ... }` does NOT auto-scroll.
- tapOn: { id: register_name }
- inputText: ${MATIKA_REGISTER_NAME}
- hideKeyboard

- scrollUntilVisible:
    element: { id: register_email }
    direction: DOWN
- tapOn: { id: register_email }
- inputText: ${MATIKA_REGISTER_EMAIL}
- hideKeyboard

- scrollUntilVisible:
    element: { id: register_password }
    direction: DOWN
- tapOn: { id: register_password }
- inputText: ${MATIKA_REGISTER_PASSWORD}
- hideKeyboard

- scrollUntilVisible:
    element: { id: register_confirm_password }
    direction: DOWN
- tapOn: { id: register_confirm_password }
- inputText: ${MATIKA_REGISTER_PASSWORD}
- hideKeyboard

- scrollUntilVisible:
    element: { id: register_terms_checkbox }
    direction: DOWN
- tapOn: { id: register_terms_checkbox }

# Disclosure substring assertion — register-time cross-region disclosure
# (EDGE-V2-16's surface). Bundled here so a failure during CG-V2-01 also
# pins the disclosure regression.
- assertVisible:
    text: "(?i).*AWS regions outside India.*"

- scrollUntilVisible:
    element: { id: register_button }
    direction: DOWN
- tapOn: { id: register_button }

# Cognito sends an OTP email and the app navigates to the verification
# screen. We don't read the email; the wrapper will admin-confirm the
# user out-of-band. Asserting we left the register screen is enough.
- extendedWaitUntil:
    notVisible: { id: register_button }
    timeout: 15000
