- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 45000 }
- extendedWaitUntil: { visible: { id: matika_mic }, timeout: 30000 }
- tapOn: { id: matika_mic }
- extendedWaitUntil: { visible: { id: matika_turn_counter, text: "turn 6" }, timeout: 60000 }

# ── Turn 7: weight thresholds ──────────────────────────────
- extendedWaitUntil: { visible: { id: matika_speaking_indicator }, timeout: 15000 }
- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 45000 }
- extendedWaitUntil: { visible: { id: matika_mic }, timeout: 30000 }
- tapOn: { id: matika_mic }
- extendedWaitUntil: { visible: { id: matika_turn_counter, text: "turn 7" }, timeout: 60000 }

# ── Turn 8: temperature frequency ──────────────────────────
- extendedWaitUntil: { visible: { id: matika_speaking_indicator }, timeout: 15000 }
- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 45000 }
- extendedWaitUntil: { visible: { id: matika_mic }, timeout: 30000 }
- tapOn: { id: matika_mic }
