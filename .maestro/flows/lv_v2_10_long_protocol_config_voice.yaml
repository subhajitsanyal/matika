- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 60000 }
- extendedWaitUntil: { visible: { id: matika_mic }, timeout: 30000 }
- tapOn: { id: matika_mic }
- extendedWaitUntil: { visible: { id: matika_turn_counter, text: "turn 14" }, timeout: 90000 }

# ── Turn 15: confirm save ──────────────────────────────────
- extendedWaitUntil: { visible: { id: matika_speaking_indicator }, timeout: 15000 }
- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 60000 }
- extendedWaitUntil: { visible: { id: matika_mic }, timeout: 30000 }
- tapOn: { id: matika_mic }
- extendedWaitUntil: { visible: { id: matika_turn_counter, text: "turn 15" }, timeout: 90000 }

# Sanity — mic re-armed = turn 15 round-tripped. Operator verifies
# 7 parameter_configs rows in RDS post-run.
- assertVisible: { id: matika_mic }
