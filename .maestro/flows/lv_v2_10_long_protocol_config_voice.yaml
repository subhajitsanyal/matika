# ── Turn 10: heart rate frequency ──────────────────────────
- extendedWaitUntil: { visible: { id: matika_speaking_indicator }, timeout: 15000 }
- extendedWaitUntil: { notVisible: { id: matika_speaking_indicator }, timeout: 45000 }
