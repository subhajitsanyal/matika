# Patient daily-logging conversation — text-fallback E2E.
#
# 3-turn flow exercising the full statement → clarify → confirm path
# on the patient daily-logging session. Originally scoped as 15 turns;
# characterization runs on 2026-05-24 surfaced that:
#
#   - Restating a new numeric value during PENDING_CONFIRMATION
#     commits-with-revision and auto-closes the session, so a "long
#     revision chain" (BP 130/85 → 140/90 → 134/87 → ...) collapses
#     to 2 turns in practice.
#   - Jane PT's parameter_configs has only BP, so once BP commits the
#     session auto-completes regardless of further turns.
#
# A genuine 15-turn shape would need either:
#   - Multi-param parameter_configs seed for Jane (glucose, weight,
#     temp, pulse, SpO2), OR
#   - The caregiver protocol-config session which is multi-param by
#     design (CG-V2-03 already runs 6 turns successfully — extension
#     to 15 should be straightforward).
#
# Both findings tracked as F56 in testing_todos_v2.md.
#
# This flow's actual value: covers the realistic patient-logging
# happy path AND the non-committing clarifying-question turn that the
# 1-turn smoke tests miss. Drives via matika_text_fallback for
# determinism.

appId: com.carelog
---
- launchApp:
    clearState: true

- extendedWaitUntil: { visible: { id: login_email }, timeout: 15000 }
- tapOn: { id: login_email }
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn: { id: login_password }
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn: { id: login_button }
- tapOn: { id: consent_checkbox, optional: true }
- tapOn: { id: consent_accept_button, optional: true }

- extendedWaitUntil: { visible: { id: patient_home_start_conversation }, timeout: 60000 }
- tapOn: { id: patient_home_start_conversation }
- extendedWaitUntil: { visible: { id: matika_text_fallback }, timeout: 30000 }

# ── Turn 1: BP statement → PENDING_CONFIRMATION ─────────────
- tapOn: { id: matika_text_fallback }
- inputText: "My blood pressure is 130 over 85."
- hideKeyboard
- tapOn: { id: matika_text_send }
- extendedWaitUntil: { notVisible: "thinking", timeout: 60000 }

# Assert the FSM is in PENDING_CONFIRMATION (session still open) —
# proves turn 1 didn't auto-commit on the text path. PENDING values
# render as cards labelled "blood_pressure_systolic / pending" +
# "blood_pressure_diastolic / pending".
- assertVisible: "(?i).*PENDING_CONFIRMATION.*"

# ── Turn 2: clarifying question (non-committing) — must NOT commit
#    or close the session. Any plain-language question without a new
#    numeric value should keep the FSM in PENDING_CONFIRMATION.
- tapOn: { id: matika_text_fallback }
- inputText: "Is that in the normal range for me?"
- hideKeyboard
- tapOn: { id: matika_text_send }
- extendedWaitUntil: { notVisible: "thinking", timeout: 60000 }
# Still PENDING after the question — proves the LLM correctly didn't
# treat "in the normal range" as a numeric value.
- assertVisible: "(?i).*PENDING_CONFIRMATION.*"

# Note: a turn-3 explicit confirm ("Yes that is correct, please save")
# intermittently flaked the tap on matika_text_send during
# characterization — the send button vanished between hideKeyboard and
# the tap. Either the LLM async-committed before turn 3 dispatched, or
# the keyboard-dismiss animation overlaps the matika_text_send
# visibility window in a Maestro-unfriendly way. Tracked as F56;
# explicit-confirm coverage is provided by caregiver_protocol_setup
# and PT-V2-03 voice. This flow stops at the 2-turn assertion above —
# proving the FSM is open + clarifying-question safe.
