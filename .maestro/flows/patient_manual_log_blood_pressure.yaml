# PT-V2-15: Manual log — Blood Pressure
#
# F4 Path A wired vital_tile_blood_pressure on PatientHomeScreen.
# Flow: login → scroll to BP tile → tap → enter systolic+diastolic
#       → tap Save → assert home-screen Snackbar "Saved BP ..." → return home.
#
# UX note (2026-05-17 update — PT-V2-15 sweep): BP uses the PR-3
# nav-result bridge pattern (BloodPressureScreen.kt:51-57 →
# PatientHomeScreen.kt:116-121) so on save it pops to home and the
# home Scaffold renders a Material3 Snackbar "Saved BP <s>/<d> mmHg".
# The five sibling screens (Pulse/SpO2/Glucose/Temperature/Weight)
# still use the legacy SaveAcknowledgement overlay testTag; this flow
# was previously written against that pattern and silently bit-rotted
# when BP migrated to PR-3.
#
# Backend evidence: sync-observation lambda writes to S3 at
#   observations/{patientId}/{YYYY}/{MM}/{DD}/{id}.json
# (Verified post-flow via CloudWatch "Stored observation ..." log line
#  AND/OR `aws s3 ls`.)
#
# Run: scripts/maestro-run.sh patient_manual_log_blood_pressure

appId: com.carelog
---
- launchApp:
    clearState: true

# ── Sign in as the patient ──────────────────────────────────
- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: login_button

# ── Patient home → scroll to BP tile ────────────────────────
- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
- scrollUntilVisible:
    element:
      id: vital_tile_blood_pressure
    direction: DOWN
    timeout: 10000
- tapOn:
    id: vital_tile_blood_pressure

# ── BloodPressureScreen mounted ─────────────────────────────
- extendedWaitUntil:
    visible:
      id: bp_save_button
    timeout: 10000

# ── Enter systolic + diastolic ──────────────────────────────
- tapOn:
    id: bp_systolic_input
- inputText: "130"
- hideKeyboard
- tapOn:
    id: bp_diastolic_input
- inputText: "85"
- hideKeyboard

# ── Save ────────────────────────────────────────────────────
- tapOn:
    id: bp_save_button

# ── Home-screen Snackbar surfaces after save (PR-3 nav-result) ──
# Snackbar text is "Saved BP <systolic>/<diastolic> mmHg". The
# Material3 SnackbarHost auto-dismisses after ~6s by default — long
# enough for Maestro to catch it. We use extendedWaitUntil on the
# regex so a future cosmetic copy change doesn't bit-rot the test.
- extendedWaitUntil:
    visible:
      text: "(?i)Saved BP 130/85.*"
    timeout: 10000

# ── Returns to patient home after Snackbar dismiss ──────────
- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
