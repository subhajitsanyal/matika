# PT-V2-18: Manual log — Weight
#
# Same pattern as patient_manual_log_blood_pressure.yaml — F4 Path A
# wired vital_tile_weight → WeightScreen with weight_value_input
# testTag. Default unit is kg.

appId: com.carelog
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: login_button

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
- scrollUntilVisible:
    element:
      id: vital_tile_weight
    direction: DOWN
    timeout: 10000
- tapOn:
    id: vital_tile_weight

- extendedWaitUntil:
    visible:
      id: weight_save_button
    timeout: 10000

- tapOn:
    id: weight_value_input
- inputText: "70.5"
- hideKeyboard

- tapOn:
    id: weight_save_button

- extendedWaitUntil:
    visible:
      id: save_acknowledgement
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
