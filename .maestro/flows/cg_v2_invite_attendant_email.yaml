# Manage Care Team E2E — invite leg.
#
# CG-V2-NN (new journey): caregiver opens Settings → Invite Attendant,
# fills the form (name + email + email-method-chip), taps Send. After
# completion the SettingsScreen should reappear (popBackStack via
# onInviteSent in `CareLogNavHost.kt:528-533`).
#
# This is the *invite* leg. The *accept* leg is exercised by
# directly invoking the `carelog-staging-accept-invite` lambda with the
# pending_invites row's invite_token — bypassing the SES sandbox + the
# need for a second device.
#
# Env vars expected:
#   MATIKA_CAREGIVER_EMAIL    — sanyalsubhajit2010+cg@gmail.com
#   MATIKA_CAREGIVER_PASSWORD — buri123@S (post-reset)
#   MATIKA_INVITE_ATTENDANT_EMAIL — fresh +atinvNNN@gmail.com
#   MATIKA_INVITE_ATTENDANT_NAME  — e.g. "Test Attendant"
#
# Run:
#   source ~/.matika-test-creds.env
#   export MATIKA_INVITE_ATTENDANT_EMAIL=sanyalsubhajit2010+atinvXXX@gmail.com
#   export MATIKA_INVITE_ATTENDANT_NAME="Test Attendant 1"
#   scripts/maestro-run.sh --no-install cg_v2_invite_attendant_email

appId: com.carelog
---
- launchApp:
    clearState: true

# Caregiver login
- extendedWaitUntil: { visible: { id: login_email }, timeout: 15000 }
- tapOn: { id: login_email }
- inputText: ${MATIKA_CAREGIVER_EMAIL}
- tapOn: { id: login_password }
- inputText: ${MATIKA_CAREGIVER_PASSWORD}
- hideKeyboard
- tapOn: { id: login_button }

# Caregiver dashboard reachable (FAB testTag is onboard_patient_fab — same as cg_v2_12).
- extendedWaitUntil: { visible: { id: caregiver_home_history }, timeout: 60000 }

# Settings — IconButton testTag added 2026-05-23 (maestro_lessons #13:
# text-match on contentDescription was landing on the inner non-clickable Icon).
- tapOn: { id: caregiver_home_settings }

# Settings card visible — scroll to find "Invite Attendant" action row
- extendedWaitUntil: { visible: { id: settings_action_invite_attendant }, timeout: 15000 }
- tapOn: { id: settings_action_invite_attendant }

# Invite Attendant screen mounted
- extendedWaitUntil: { visible: { id: invite_attendant_name }, timeout: 10000 }

# Fill the form
- tapOn: { id: invite_attendant_name }
- inputText: ${MATIKA_INVITE_ATTENDANT_NAME}
- hideKeyboard

# Confirm email method is selected (default true, but be explicit for
# durability — the F51 fix is local to LanguageOptionRow; FilterChip
# has its own onClick on the chip itself).
- tapOn: { id: invite_attendant_method_email }

- tapOn: { id: invite_attendant_email }
- inputText: ${MATIKA_INVITE_ATTENDANT_EMAIL}
- hideKeyboard

# Send
- tapOn: { id: invite_attendant_send }

# After Send the Material3 AlertDialog shows either "Invitation Sent!" (SES OK)
# or "Invite Created" (SES delivery_failed — invite row still committed). Either
# proves the lambda 201'd. testTags do NOT propagate through M3 AlertDialog's
# PopupLayer in this Compose version (verified 2026-05-23) — use text-match.
- extendedWaitUntil:
    visible: ".*(Invitation Sent|Invite Created).*"
    timeout: 30000

# Tap Done — Button is the clickable parent of the inner Text "Done".
- tapOn: "Done"
- extendedWaitUntil:
    visible: { id: settings_action_invite_attendant }
    timeout: 15000
