# LV-V2-08 — Patient daily-logging pause + resume mid-session (text).
#
# Catalog entry (`docs/voice_multi_turn_journeys.md` LV-V2-08): F2
# explicit-close FSM coverage. Verifies the Pause / Resume button on
# MatikaConversationScreen toggles `conversation.isPausedByUser` and
# that after a pause + resume the session can still take a new
# (confirm) turn and reach session_status='complete'.
#
# Distinct from `patient_pause_resume_text.yaml` (EDGE-V2-11): that
# flow only asserts the label flip (Pause ↔ Resume) as a UI smoke.
# THIS flow drives an actual vital-logging multi-turn around the
# pause, so the load-bearing assertion is the FSM transitions:
#
#   Turn 1: BP statement → session_status=in_progress, fsm_state=PENDING_CONFIRMATION
#   Tap Pause → conversation.isPausedByUser=true (UI Resume label visible)
#   Wait 5s → no FSM activity (Maestro can't actively assert this; soak)
#   Tap Resume → conversation.isPausedByUser=false (Pause label back)
#   Turn 2: confirm → FSM walks PENDING→COMMITTED, session reaches complete.
#
# The Pause/Resume button has no testTag (bare OutlinedButton with Text
# child). Targeting via accessibility-text regex per
# `patient_pause_resume_text.yaml`'s precedent.
#
# Pre-conditions:
#   - Jane PT (MATIKA_PATIENT_EMAIL / MATIKA_PATIENT_PASSWORD) seeded
#     with BP parameter_configs on dev/staging.
#   - APK installed.
#
# Run:
#   source ~/.matika-test-creds.env
#   scripts/maestro-run.sh --no-install lv_v2_08_pause_resume_text
#
# Cross-references:
#   - EDGE-V2-11 (button label smoke): `patient_pause_resume_text.yaml`
#   - Catalog: `docs/voice_multi_turn_journeys.md` LV-V2-08
#
# Final assertion (operator-side, RDS):
#   SELECT session_status FROM interaction_sessions
#   WHERE patient_cognito_sub='<jane>' ORDER BY created_at DESC LIMIT 1;
#   Expect: 'complete'.

appId: com.carelog
---
- launchApp:
    clearState: true

- extendedWaitUntil: { visible: { id: login_email }, timeout: 15000 }
- tapOn: { id: login_email }
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn: { id: login_password }
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn: { id: login_button }

- extendedWaitUntil: { visible: { id: patient_home_start_conversation }, timeout: 60000 }
- tapOn: { id: patient_home_start_conversation }
- tapOn: { text: "Allow|While using the app", optional: true }

# Wait for conversation screen to mount.
- extendedWaitUntil: { visible: { id: matika_text_fallback }, timeout: 30000 }

# ── Turn 1: BP statement → PENDING_CONFIRMATION ────────────
- tapOn: { id: matika_text_fallback }
- inputText: "My blood pressure is 130 over 85."
- hideKeyboard
- tapOn: { id: matika_text_send }
- extendedWaitUntil: { notVisible: "thinking", timeout: 60000 }
- extendedWaitUntil: { visible: { id: matika_response_card }, timeout: 60000 }

# Initial state: Pause button visible (isPausedByUser=false).
- assertVisible: ".*Pause.*"

# ── Tap Pause → conversation.isPausedByUser=true ───────────
- tapOn: ".*Pause.*"
- extendedWaitUntil:
    visible: ".*Resume.*"
    timeout: 5000

# ── 5-second soak (per catalog spec) ───────────────────────
# Maestro doesn't have a direct `sleep` primitive, but
# `extendedWaitUntil` with a guaranteed-already-visible element and
# a 5s timeout serves as a deterministic dwell.
- extendedWaitUntil:
    visible: ".*Resume.*"
    timeout: 5000

# ── Tap Resume → conversation.isPausedByUser=false ─────────
- tapOn: ".*Resume.*"
- extendedWaitUntil:
    visible: ".*Pause.*"
    timeout: 5000

# ── Turn 2: confirm BP → FSM walks to COMMITTED ────────────
# The pending BP from turn 1 must still be in the FSM state — that's
# the load-bearing assertion (pause preserved pending state).
- tapOn: { id: matika_text_fallback }
- inputText: "Yes, please save that."
- hideKeyboard
- tapOn: { id: matika_text_send }
- extendedWaitUntil: { notVisible: "thinking", timeout: 60000 }

# Sanity — text fallback still visible, session still alive (and
# now expected to be in_progress for next vital OR complete if BP
# was the only configured vital for Jane).
- assertVisible: { id: matika_text_fallback }
