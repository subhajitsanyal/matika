# PT-V2-20: Manual log — SpO₂
#
# Same pattern as patient_manual_log_blood_pressure.yaml — F4 Path A
# wired vital_tile_spo2 → SpO2Screen with spo2_value_input testTag.

appId: com.carelog
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: login_button

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
- scrollUntilVisible:
    element:
      id: vital_tile_spo2
    direction: DOWN
    timeout: 10000
- tapOn:
    id: vital_tile_spo2

- extendedWaitUntil:
    visible:
      id: spo2_save_button
    timeout: 10000

- tapOn:
    id: spo2_value_input
- inputText: "98"
- hideKeyboard

- tapOn:
    id: spo2_save_button

- extendedWaitUntil:
    visible:
      id: save_acknowledgement
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
