# PT-V2-19: Manual log — Pulse
#
# Same pattern as patient_manual_log_blood_pressure.yaml — F4 Path A
# wired vital_tile_pulse → PulseScreen with pulse_value_input testTag.

appId: com.carelog
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: login_button

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
- scrollUntilVisible:
    element:
      id: vital_tile_pulse
    direction: DOWN
    timeout: 10000
- tapOn:
    id: vital_tile_pulse

- extendedWaitUntil:
    visible:
      id: pulse_save_button
    timeout: 10000

- tapOn:
    id: pulse_value_input
- inputText: "72"
- hideKeyboard

- tapOn:
    id: pulse_save_button

- extendedWaitUntil:
    visible:
      id: save_acknowledgement
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 15000
