# EDGE-V2-04 — `FORCE_CHANGE_PASSWORD` first-time login.
#
# Pre-condition: the wrapper has called
# `harness_admin_create_force_change_password_user` to create a Cognito
# user with MessageAction=SUPPRESS (no email sent) + a known temp
# password. The user starts in FORCE_CHANGE_PASSWORD state.
#
# This flow:
#   1. Logs in with the temp password.
#   2. Asserts NewPasswordScreen mounts (Cognito returned the
#      NEW_PASSWORD_REQUIRED challenge; AuthRepository.signIn() now
#      surfaces SignInOutcome.NewPasswordRequired instead of failing).
#   3. Enters the new password twice and submits.
#   4. AuthRepository.confirmNewPassword resolves the challenge; the
#      app bounces through SPLASH and lands on the consent screen
#      (the user has no consent_records row yet).
#   5. Asserts consent_accept_button mounts — proves the new password
#      worked AND the auth session is live.
#
# Env passed by the wrapper:
#   MATIKA_REGISTER_EMAIL  — invited-user email
#   MATIKA_TEMP_PASSWORD   — temp password set by admin-create-user
#   MATIKA_NEW_PASSWORD    — the new password to set during the challenge
#
# Run via wrapper, not directly: scripts/cognito-harness-maestro.sh edge-v2-04

appId: com.carelog
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: login_email }
    timeout: 15000

# Sign in with the temporary password.
- tapOn: { id: login_email }
- inputText: ${MATIKA_REGISTER_EMAIL}
- tapOn: { id: login_password }
- inputText: ${MATIKA_TEMP_PASSWORD}
- hideKeyboard
- tapOn: { id: login_button }

# Cognito returns NEW_PASSWORD_REQUIRED → LoginViewModel routes to
# NewPasswordScreen. The hint text echoes the email back as context
# so a second testTag confirms the right screen mounted, not just any
# password prompt.
- extendedWaitUntil:
    visible: { id: new_password_input }
    timeout: 20000
- assertVisible: { id: new_password_email_hint }

- tapOn: { id: new_password_input }
- inputText: ${MATIKA_NEW_PASSWORD}
- hideKeyboard
- tapOn: { id: new_password_confirm_input }
- inputText: ${MATIKA_NEW_PASSWORD}
- hideKeyboard
- tapOn: { id: new_password_submit }

# After confirmNewPassword resolves the challenge, AuthState is
# Authenticated. Splash routes to ConsentScreen because no
# consent_records row exists for this fresh user.
- extendedWaitUntil:
    visible: { id: consent_accept_button }
    timeout: 20000
