# Bench helper — log in as patient and switch app language to Bengali
# via the in-UI picker (F22). Used to prime the device DataStore before
# running voice flows that depend on `appSettings.language = bn` such
# as `patient_voice_bp_bn_single_turn`. Not a journey itself.
#
# Underscore-prefix marks this as orchestration-only, not coverage.
appId: com.carelog
---
- launchApp:
    clearState: true

- tapOn: { id: login_email }
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn: { id: login_password }
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn: { id: login_button }

- extendedWaitUntil: { visible: { id: patient_home_start_conversation }, timeout: 30000 }

# Settings IconButton in the TopAppBar — testTag added 2026-05-23.
- tapOn: { id: patient_home_settings }

- extendedWaitUntil: { visible: { id: settings_language_card }, timeout: 10000 }
- scrollUntilVisible:
    element: { id: language_option_bn }
- tapOn: { id: language_option_bn }

# Back out so the voice flow's launchApp doesn't land on Settings.
- back
- extendedWaitUntil: { visible: { id: patient_home_start_conversation }, timeout: 10000 }
