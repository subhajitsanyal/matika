# PT-V2-03 (English voice) — Patient logs blood pressure via the
# voice path. See docs/journeys.md §4.
#
# Why this flow can't speak by itself: Maestro can't drive an external
# Mac process. The shell that launches Maestro is responsible for
# speaking utterances through scripts/matika-say.sh. This flow drives
# only the UI — its job is to (1) reach the conversation screen,
# (2) tap the mic at predictable moments, and (3) wait for response
# round-trips. The runner script orchestrates the say timing.
#
# Run (recommended — F7 logcat-trigger orchestration):
#   source ~/.matika-test-creds.env
#   scripts/matika-voice-run.sh patient_voice_bp_en --no-install \
#       --turn "en|175|My blood pressure is one thirty over eighty five.|600" \
#       --turn "en|175|Yes, that's correct.|400"
#
# matika-voice-run.sh blocks on `adb logcat -e "Offline recognizer - start listening" -m 1`
# between turns, so audio fires precisely when the mic activates — no
# fixed-sleep race. See docs/testing_todos_v2.md F7.
#
# Legacy fixed-sleep pattern (deprecated, kept for reference):
#   ( scripts/maestro-run.sh patient_voice_bp_en --no-install ) &
#   sleep 25 ; scripts/matika-say.sh en 175 "..." 600
#   sleep 12 ; scripts/matika-say.sh en 175 "Yes, that's correct." 400
#   wait
# This is unreliable because cold install + login + nav varies 25–60s.
#
# Pre-conditions:
#   - APK installed; backend dev /health green.
#   - Patient creds in shell env (MATIKA_PATIENT_EMAIL/_PASSWORD).
#   - Test patient parameter_configs include blood_pressure_systolic
#     and blood_pressure_diastolic.
#   - Phone speaker side ~6-12 inches from External Headphones,
#     ambient noise low. Phone media volume mid-high.
#   - SwitchAudioSource installed; matika-say.sh re-asserts the output
#     device on every utterance.

appId: com.carelog
---
- launchApp:
    clearState: true

# Sign in as the patient. Same shape as patient_logging_happy_path.
- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MATIKA_PATIENT_PASSWORD}
- hideKeyboard
- tapOn:
    id: login_button

- extendedWaitUntil:
    visible:
      id: patient_home_start_conversation
    timeout: 30000
- tapOn:
    id: patient_home_start_conversation

# Mic permission prompt: granted on first run, absent thereafter.
- tapOn:
    text: "Allow|While using the app"
    optional: true

# === Turn 1 ===
# matika-voice-run.sh blocks on the SodaSpeechRecognizer
# "start listening" trigger before speaking, so we don't need a
# fixed sleep here. Tap mic; runner takes care of the timing.
- extendedWaitUntil:
    visible:
      id: matika_mic
    timeout: 30000
- tapOn:
    id: matika_mic

# F6 — wait for the response card to mount, which only happens after
# /conversation/turn returns and ConversationState.lastResponseText
# becomes non-blank. This is non-vacuous proof of a Bedrock round-trip
# (replaces the prior `notVisible: "thinking"` which passed even when
# no turn was ever submitted).
- extendedWaitUntil:
    visible:
      id: matika_response_card
    timeout: 60000

# === Turn 2 — patient confirms ===
# F6 — must wait for TTS playback to finish before tapping mic again.
# Otherwise Soda hears both the app's response audio AND our utterance,
# returns error 7 (NO_MATCH), and the turn never reaches Bedrock.
#
# Two-phase wait — first wait for the indicator to APPEAR (TTS started),
# then wait for it to disappear (TTS finished). The single notVisible
# check alone races against the gap between "thinking" hiding and
# "speaking" appearing — at that moment notVisible passes immediately
# and the runner taps mic before any TTS plays, so the mic captures
# the about-to-start response audio as user input (F57 multi-turn
# bench session 2026-05-24 — "you said" rendered as the app's echo).
- extendedWaitUntil:
    visible:
      id: matika_speaking_indicator
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: matika_speaking_indicator
    timeout: 30000
# matika_response_card stays visible across turns (it just shows the
# latest response text). To detect turn-2 progression we wait on the
# turn counter advancing to "turn 2" — that increments only when
# ConversationStateMachine.applyTurnResponse runs on the second turn.
- extendedWaitUntil:
    visible:
      id: matika_mic
    timeout: 30000
- tapOn:
    id: matika_mic
- extendedWaitUntil:
    visible:
      id: matika_turn_counter
      text: "turn 2"
    timeout: 60000

# Sanity: mic re-armed = the turn round-tripped cleanly. Bedrock may
# now ask about the next parameter or close the session — either is
# a pass for this single-parameter flow.
- assertVisible:
    id: matika_mic
