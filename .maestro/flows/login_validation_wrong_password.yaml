# EDGE-V2-02 — login with the wrong password should surface
# Cognito's NotAuthorizedException as a user-visible error and NOT
# advance to a home screen.
#
# Why this matters as a regression check: Cognito returns
# "Failed since user is not authorized." which the app currently
# displays verbatim (we saw this in the first sweep when test-data
# creds were stale).
#
# Run:
#   source ~/.matika-test-creds.env
#   scripts/maestro-run.sh login_validation_wrong_password

appId: com.carelog
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 15000
- tapOn:
    id: login_email
- inputText: ${MATIKA_PATIENT_EMAIL}
- tapOn:
    id: login_password
- inputText: "definitely-wrong-password-XXX!"
- hideKeyboard
- tapOn:
    id: login_button

# Cognito takes 1-3s to reject. We want the error to appear AND we
# want NOT to land on patient home. Two independent assertions.
# Maestro plain-string text matcher uses full-string regex semantics
# (the pattern must match the WHOLE text node content, not a
# substring). The login error "Failed since user is not authorized."
# is a single Compose Text node — substring match needs explicit
# .* wildcards.
- extendedWaitUntil:
    visible: ".*Failed since user is not authorized.*"
    timeout: 15000

# Confirm we're STILL on the login screen — the home screen testTag
# must NOT be visible. Use notVisible to assert non-progression.
- assertVisible:
    id: login_button
- assertVisible:
    id: login_email
